<body class="bg-slate-100 font-sans text-slate-800 pb-12">

    <!-- Header Mobile -->

            <div>
                <h1 class="font-bold text-base flex items-center gap-2">

        </div>

        <!-- ================= MENU UTAMA ================= -->

            <button onclick="showView('aset')" class="w-full bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-left flex items-center gap-4 hover:border-blue-400 transition">

            </button>
            <button onclick="showView('stok')" class="w-full bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-left flex items-center gap-4 hover:border-amber-400 transition">
                <div class="bg-amber-50 text-amber-600 p-3 rounded-xl text-xl"><i class="fa-solid fa-pump-soap"></i></div>
                <div><h3 class="font-bold text-slate-800 text-sm">Ambil Stok Toiletris/ATK</h3><p class="text-xs text-slate-500">Catat pengambilan stok dari gudang kantor</p></div>
            </button>
        </div>

        <!-- ================= VIEW: PENGECEKAN ASET (existing, tidak diubah logikanya) ================= -->
        <div id="viewAset" class="hidden space-y-4">
            <button onclick="showView('menu')" class="text-xs text-blue-600 font-semibold flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu</button>

            <!-- Filter Pilih Lokasi Kantor -->
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-2">
                <label class="block text-xs font-bold text-slate-700">Pilih Lokasi Kantor Anda saat ini:</label>
                <select id="mobileOfficeSelect" onchange="renderMobileList()" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- TAMPILKAN SEMUA KANTOR --</option>
                </select>
            </div>

            <!-- Daftar Aset yang Harus Diperiksa OB -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-sm">Daftar Aset Terdaftar</h2>
                    <span id="assetCountBadge" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold">0 Aset</span>
                </div>
                <div id="mobileAssetList" class="space-y-3">
                    <div class="bg-white p-4 rounded-xl text-center text-slate-400 text-xs shadow-sm">
                        Memuat data dari Cloud...
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= VIEW: AMBIL STOK TOILETRIS/ATK (baru) ================= -->
        <div id="viewStok" class="hidden space-y-4">
            <button onclick="showView('menu')" class="text-xs text-blue-600 font-semibold flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu</button>

            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Anda (Pengambil):</label>
                    <input type="text" id="stokNamaPengambil" placeholder="Nama lengkap..." class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Pilih Lokasi Kantor:</label>
                    <select id="stokOfficeSelect" onchange="onStokOfficeChange()" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="">-- Pilih Kantor --</option>
                    </select>
                </div>
            </div>

            <div id="stokItemList" class="space-y-3">
                <div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs shadow-sm">Pilih lokasi kantor untuk melihat stok yang tersedia.</div>
            </div>
        </div>
    </div>

    <!-- Modal Ambil Stok -->
    <div id="takeModalBg" class="hidden fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
        <div class="bg-white p-5 rounded-xl w-full max-w-sm space-y-3 shadow-xl">
            <h3 id="takeModalTitle" class="font-bold text-slate-800 text-base">Ambil Barang</h3>
            <p id="takeModalInfo" class="text-xs text-slate-500"></p>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah</label>
                <input type="number" id="takeQty" min="1" value="1" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Catatan (opsional)</label>
                <input type="text" id="takeNote" placeholder="mis. untuk lantai 3" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeTakeModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg text-sm font-semibold">Batal</button>
                <button onclick="submitTakeStock()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg text-sm font-semibold">Simpan</button>
            </div>
        </div>
    </div>

        // Konfigurasi Firebase Asli
        const firebaseConfig = {
            apiKey: "AIzaSyB5lUCpypIJ_GXgRUedVKID7FpF8J-r2fQ",
            authDomain: "management-asset-ga.firebaseapp.com",
            databaseURL: "https://management-asset-ga-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "management-asset-ga",
            storageBucket: "management-asset-ga.firebasestorage.app",
            messagingSenderId: "590491043979",
            appId: "1:590491043979:web:e4fe2633bf8e24ae27ac8e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const allOfficesList = [
            'Karang Tinggal 27', 'Aruman Cimahi', 'Cipadung', 'Baleendah',
            'BN 1', 'BN 2', 'BN 3', 'Cifor', 'Bango',
            'SO Tasikmalaya', 'SO Cirebon', 'SO Karawang', 'SO Depok',
            'SO Bekasi Kota', 'SO Bekasi Kabupaten', 'SO Tangerang Selatan', 'SO Tangerang Kota',
            'SO Depok 2', 'Kedung Halang'
        ];

        let globalAssets = [];
        let globalReports = [];
        let globalRepairs = [];

        // ==== RESET KONDISI ASET OTOMATIS SETIAP TANGGAL 25 ====
        // Tidak mengubah firebaseConfig / EmailJS. Hanya menambah key 'lastResetPeriod'
        // di dalam node 'ga_data' yang sama, dan mengubah field condition tiap aset.
        function getPeriodKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function checkAndResetIfNeeded() {
            const now = new Date();
            if (now.getDate() < 25) return; // hanya aktif mulai tanggal 25 s/d akhir bulan

            const periodKey = getPeriodKey(now);
            const resetMarkerRef = db.ref('ga_data/lastResetPeriod');

            // Transaction memastikan walau banyak HP OB buka bersamaan,
            // reset hanya terjadi SATU KALI per periode (anti duplikat).
            resetMarkerRef.transaction((current) => {
                if (current === periodKey) return; // batalkan, sudah pernah direset bulan ini
                return periodKey;
            }, (error, committed, snapshot) => {
                if (!error && committed && snapshot.val() === periodKey) {
                    performMonthlyReset(periodKey);
                }
            });
        }

        function performMonthlyReset(periodKey) {
            db.ref('ga_data/assets').once('value', (snap) => {
                const assets = snap.val() || [];
                const resetAssets = assets.map(a => ({ ...a, condition: 'Belum diperiksa' }));
                db.ref('ga_data/assets').set(resetAssets);
            });

            db.ref('ga_data/reports').once('value', (snap) => {
                const reports = snap.val() || [];
                reports.unshift({
                    timestamp: new Date().toLocaleString('id-ID'),
                    type: 'MONTHLY_RESET',
                    assetCode: '-',
                    assetName: 'SEMUA ASET',
                    location: 'Seluruh Kantor',
                    inspector: 'Sistem Otomatis',
                    result: 'Belum diperiksa',
                    note: `Reset otomatis periode ${periodKey}: seluruh kondisi aset direset ke "Belum diperiksa" untuk pemeriksaan ulang.`
                });
                db.ref('ga_data/reports').set(reports);
            });
        }

        function listenToRealtimeData() {
            db.ref('ga_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    globalAssets = data.assets || [];
                    globalReports = data.reports || [];
                    globalRepairs = data.repairs || [];
                }
                populateOfficeOptions();
                renderMobileList();
            });
        }

        function saveDataToCloud() {
            db.ref('ga_data').set({
                assets: globalAssets,
                reports: globalReports,
                repairs: globalRepairs
            });
        }

        function populateOfficeOptions() {
            const select = document.getElementById('mobileOfficeSelect');
            if (select && select.children.length <= 1) {
                allOfficesList.forEach(off => {
                    const opt = document.createElement('option');
                    opt.value = off;
                    opt.innerText = off;
                    select.appendChild(opt);
                });
            }
            const stokSelect = document.getElementById('stokOfficeSelect');
            if (stokSelect && stokSelect.children.length <= 1) {
                allOfficesList.forEach(off => {
                    const opt = document.createElement('option');
                    opt.value = off;
                    opt.innerText = off;
                    stokSelect.appendChild(opt);
                });
            }
        }

        /* ==========================================================================================
           NAVIGASI MENU (Pengecekan Aset / Ambil Stok)
           ========================================================================================== */
        function showView(view) {
            document.getElementById('viewMenu').classList.add('hidden');
            document.getElementById('viewAset').classList.add('hidden');
            document.getElementById('viewStok').classList.add('hidden');
            const subtitle = document.getElementById('headerSubtitle');
            if (view === 'menu') { document.getElementById('viewMenu').classList.remove('hidden'); subtitle.innerText = 'Pilih menu di bawah'; }
            else if (view === 'aset') { document.getElementById('viewAset').classList.remove('hidden'); subtitle.innerText = 'Sistem Inspeksi & Lapangan'; }
            else if (view === 'stok') { document.getElementById('viewStok').classList.remove('hidden'); subtitle.innerText = 'Ambil Stok Toiletris / ATK'; }
        }

        /* ==========================================================================================
           MODUL AMBIL STOK TOILETRIS / ATK
           Membaca & menulis path Firebase yang SAMA dengan dashboard PC (menu "Pengisian Stock Toiletris")
           /stock/{lokasi}/{itemKey} = { namaBarang, kategori, satuan, stockMaksimum, sisaBarang }
           /stock_take_log/{pushId}  = { tanggal, lokasi, namaBarang, kategori, satuan, qty, namaPengambil, catatan }
           ========================================================================================== */
        let stokLokasi = '';
        let stokItems = {};
        let stokKategoriTab = 'Semua';
        let stokListenerRef = null;
        let takeModalItemKey = null;

        function onStokOfficeChange() {
            stokLokasi = document.getElementById('stokOfficeSelect').value;
            if (stokListenerRef) stokListenerRef.off();
            const container = document.getElementById('stokItemList');
            if (!stokLokasi) { container.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs shadow-sm">Pilih lokasi kantor untuk melihat stok yang tersedia.</div>'; return; }
            container.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs shadow-sm">Memuat stok...</div>';
            stokListenerRef = db.ref('stock/' + stokLokasi);
            stokListenerRef.on('value', snap => {
                stokItems = snap.val() || {};
                stokKategoriTab = 'Semua';
                renderStokItemList();
            });
        }

        function stokStatusOf(item) {
            const sisa = Number(item.sisaBarang) || 0;
            const maks = Number(item.stockMaksimum) || 0;
            if (sisa <= 0) return { label: 'HABIS', cls: 'bg-rose-100 text-rose-700 border-rose-300' };
            if (maks > 0 && sisa <= maks * 0.2) return { label: 'MENIPIS', cls: 'bg-amber-100 text-amber-700 border-amber-300' };
            return { label: 'TERSEDIA', cls: 'bg-emerald-100 text-emerald-700 border-emerald-300' };
        }

        function setStokTab(c) { stokKategoriTab = c; renderStokItemList(); }

        function renderStokItemList() {
            const container = document.getElementById('stokItemList');
            const keys = Object.keys(stokItems);
            if (keys.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs shadow-sm">Belum ada barang tercatat untuk kantor ini. Minta GA mengisi stok dulu lewat dashboard PC.</div>`;
                return;
            }
            const items = keys.map(k => ({ key: k, ...stokItems[k] }));
            const categories = Array.from(new Set(items.map(i => i.kategori || 'Lainnya')));

            let tabsHtml = '';
            if (categories.length > 1) {
                tabsHtml = '<div class="flex gap-1.5 overflow-x-auto pb-1">' + ['Semua', ...categories].map(c => `<button onclick="setStokTab('${c.replace(/'/g, "\\'")}')" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-semibold border ${stokKategoriTab === c ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-300'}">${c}</button>`).join('') + '</div>';
            }

            const filtered = stokKategoriTab === 'Semua' ? items : items.filter(i => (i.kategori || 'Lainnya') === stokKategoriTab);
            const cardsHtml = filtered.map(item => {
                const st = stokStatusOf(item);
                const isOut = st.label === 'HABIS';
                return `<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <div class="flex justify-between items-start">
                        <div><h3 class="font-bold text-slate-800 text-sm">${item.namaBarang}</h3><p class="text-[11px] text-slate-400">${item.kategori || '-'}</p></div>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${st.cls}">${st.label}</span>
                    </div>
                    <div class="text-lg font-bold text-slate-800">${item.sisaBarang} <span class="text-xs font-normal text-slate-400">${item.satuan || ''}</span></div>
                    <button onclick="openTakeModal('${item.key}')" ${isOut ? 'disabled' : ''} class="w-full ${isOut ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-white'} font-bold py-2 rounded-lg text-xs transition">${isOut ? 'Stok Habis' : 'Ambil Barang'}</button>
                </div>`;
            }).join('');
            container.innerHTML = (tabsHtml ? tabsHtml : '') + '<div class="space-y-3 mt-3">' + cardsHtml + '</div>';
        }

        function openTakeModal(itemKey) {
            const namaPengambil = document.getElementById('stokNamaPengambil').value.trim();
            if (!namaPengambil) { alert('Isi dulu Nama Anda di bagian atas sebelum mengambil barang.'); return; }
            takeModalItemKey = itemKey;
            const item = stokItems[itemKey];
            document.getElementById('takeModalTitle').innerText = 'Ambil: ' + item.namaBarang;
            document.getElementById('takeModalInfo').innerText = (item.kategori || '-') + ' · sisa stok: ' + item.sisaBarang + ' ' + (item.satuan || '');
            document.getElementById('takeQty').value = 1;
            document.getElementById('takeQty').max = item.sisaBarang;
            document.getElementById('takeNote').value = '';
            document.getElementById('takeModalBg').classList.remove('hidden');
            document.getElementById('takeModalBg').classList.add('flex');
        }
        function closeTakeModal() {
            document.getElementById('takeModalBg').classList.add('hidden');
            document.getElementById('takeModalBg').classList.remove('flex');
        }

        function submitTakeStock() {
            const namaPengambil = document.getElementById('stokNamaPengambil').value.trim();
            const qty = Number(document.getElementById('takeQty').value) || 0;
            const note = document.getElementById('takeNote').value.trim();
            if (!qty || qty < 1) { alert('Jumlah harus lebih dari 0.'); return; }
            const item = stokItems[takeModalItemKey];
            if (!item) { alert('Item tidak ditemukan, coba refresh.'); return; }
            if (qty > Number(item.sisaBarang || 0)) { alert('Jumlah melebihi sisa stok yang ada.'); return; }

            const ref = db.ref(`stock/${stokLokasi}/${takeModalItemKey}/sisaBarang`);
            ref.transaction(current => {
                const cur = Number(current) || 0;
                if (qty > cur) return; // batalkan bila stok sudah berubah duluan (race condition)
                return cur - qty;
            }, (error, committed) => {
                if (error) { alert('Gagal menyimpan: ' + error.message); return; }
                if (!committed) { alert('Stok barang ini baru saja berubah (mungkin diambil orang lain). Silakan coba lagi.'); return; }
                db.ref('stock_take_log').push({
                    timestamp: Date.now(), tanggal: new Date().toLocaleString('id-ID'),
                    lokasi: stokLokasi, namaBarang: item.namaBarang, kategori: item.kategori || '', satuan: item.satuan || '',
                    qty, namaPengambil, catatan: note
                });
                closeTakeModal();
                alert('✓ Pengambilan berhasil dicatat.');
            });
        }

        function renderMobileList() {
            const selectedOffice = document.getElementById('mobileOfficeSelect').value;
            const container = document.getElementById('mobileAssetList');
            
            let filtered = selectedOffice ? globalAssets.filter(a => a.location === selectedOffice) : globalAssets;
            document.getElementById('assetCountBadge').innerText = `${filtered.length} Aset`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs shadow-sm">Belum ada aset terdaftar pada kantor ini.</div>`;
                return;
            }

            container.innerHTML = filtered.map((asset) => {
                const realIndex = globalAssets.findIndex(a => a.code === asset.code);
                const isSeptic = (asset.category || '').toLowerCase().includes('septic tank');
                
                const hasActiveRepair = globalRepairs.some(r => r.assetCode === asset.code && r.status === 'Aktif');
                const badConditions = ['Mati', 'Perlu perbaikan', 'Perlu di sedot'];
                const isDamaged = badConditions.includes(asset.condition) || hasActiveRepair;
                const needsInspection = asset.condition === 'Belum diperiksa';

                let badgeClass = 'bg-emerald-100 text-emerald-800';
                if (isDamaged) badgeClass = 'bg-rose-100 text-rose-800';
                else if (needsInspection) badgeClass = 'bg-amber-100 text-amber-800';

                return `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="font-mono text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">${asset.code}</span>
                                <h3 class="font-bold text-slate-800 text-sm mt-1">${asset.name}</h3>
                                <p class="text-xs text-blue-600 font-medium">${asset.location} • <span class="text-slate-500">${asset.category || '-'}</span></p>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badgeClass}">
                                ${asset.condition}
                            </span>
                        </div>

                        ${isDamaged ? `
                            <div class="bg-rose-50 border border-rose-200 p-3 rounded-lg text-xs text-rose-700 space-y-1">
                                <div class="font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-lock"></i> Aset Dalam Perbaikan / Rusak
                                </div>
                                <p class="text-[11px] text-rose-600">
                                    Status dikunci. Hanya Admin GA di Web PC yang dapat mengubah kembali status menjadi "Baik" setelah perbaikan diselesaikan.
                                </p>
                            </div>
                        ` : `
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2 text-xs">
                                ${needsInspection ? `
                                    <div class="bg-amber-50 border border-amber-200 text-amber-700 rounded-lg p-2 text-[11px] font-medium flex items-center gap-1.5">
                                        <i class="fa-solid fa-triangle-exclamation"></i> Aset ini belum diperiksa pada periode ini. Mohon lakukan pengecekan.
                                    </div>
                                ` : ''}
                                <label class="font-bold text-slate-700 block">Laporkan Kondisi Terbaru:</label>
                                <select id="ob-cond-${realIndex}" class="w-full border border-slate-300 p-2 rounded-lg bg-white font-medium text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                                    ${isSeptic ? `
                                        <option value="Baik">Kondisi Baik / Normal</option>
                                        <option value="Perlu di sedot">Penuh (Perlu di-sedot)</option>
                                    ` : `
                                        <option value="Baik">Kondisi Baik / Normal</option>
                                        <option value="Perlu perbaikan">Rusak (Perlu Perbaikan)</option>
                                        <option value="Mati">Mati Total</option>
                                    `}
                                </select>
                                <input type="text" id="ob-note-${realIndex}" placeholder="Catatan/Keterangan OB..." class="w-full border border-slate-300 p-2 rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">
                                <button onclick="submitObReport(${realIndex})" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition shadow-sm flex justify-center items-center gap-1.5">
                                    <i class="fa-solid fa-paper-plane"></i> Kirim Laporan ke Admin PC
                                </button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function submitObReport(index) {
            const asset = globalAssets[index];
            const condSelect = document.getElementById(`ob-cond-${index}`);
            const noteInput = document.getElementById(`ob-note-${index}`);

            const newCondition = condSelect.value;
            const note = noteInput ? noteInput.value.trim() || 'Pemeriksaan rutin OB' : 'Pemeriksaan rutin OB';

            asset.condition = newCondition;

            globalReports.unshift({
                timestamp: new Date().toLocaleString('id-ID'),
                type: 'INSPECTION_OB',
                assetCode: asset.code,
                assetName: asset.name,
                location: asset.location,
                inspector: 'Petugas OB',
                result: newCondition,
                note: note
            });

            if (newCondition !== 'Baik') {
                const existingActive = globalRepairs.some(r => r.assetCode === asset.code && r.status === 'Aktif');
                if (!existingActive) {
                    globalRepairs.unshift({
                        time: new Date().toLocaleString('id-ID'),
                        assetCode: asset.code,
                        asset: asset.name,
                        location: asset.location,
                        note: `Laporan OB: ${newCondition} - "${note}"`,
                        status: 'Aktif'
                    });

                    // Kirim Email Notifikasi Otomatis ke PIC Kantor Terkait
                    const emailSubject = `[URGENT OB] Laporan Kendala Aset - ${asset.location}`;
                    const emailBody = `Halo Tim GA,\n\nPetugas OB melaporkan kendala berikut dari lapangan:\n\n- Nama Aset: ${asset.name} (${asset.code})\n- Lokasi Kantor: ${asset.location}\n- Kondisi / Kendala: ${newCondition}\n- Catatan OB: ${note}\n- Waktu Laporan: ${new Date().toLocaleString('id-ID')}\n\nMohon segera diteruskan ke teknisi / ditindaklanjuti.\n\nTerima kasih,\nSistem Mobile GA`;
                    
                    sendNotificationEmail(asset.location, emailSubject, emailBody);
                }
            }

            saveDataToCloud();
            alert("✓ Laporan berhasil terkirim ke PC Admin dan Email PIC!");
        }

        window.onload = function() {
            listenToRealtimeData();
            checkAndResetIfNeeded();
            setInterval(checkAndResetIfNeeded, 60000); // cek ulang tiap 1 menit selama app terbuka
        };
    </script>
</body>
</html>
