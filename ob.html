<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile GA Inspection - OB</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10">

    <!-- Header Mobile -->
    <div class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-clipboard-check"></i> GA Mobile Inspection
            </h1>
            <span id="connectionStatus" class="text-xs bg-blue-700 px-2 py-1 rounded text-blue-100">Live</span>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <!-- Pilih Lokasi Cabang (19 Cabang) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Pilih Kantor Cabang</label>
            <select id="branchSelect" onchange="loadBranchAssets()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Pilih Cabang --</option>
                <option value="Karang tinggal">Karang tinggal</option>
                <option value="Aruman">Aruman</option>
                <option value="BN 1">BN 1</option>
                <option value="BN 2">BN 2</option>
                <option value="BN 3">BN 3</option>
                <option value="Cipadung">Cipadung</option>
                <option value="Baleendah">Baleendah</option>
                <option value="Bango">Bango</option>
                <option value="Cifor">Cifor</option>
                <option value="Kedung Halang">Kedung Halang</option>
                <option value="SO Tasikmalaya">SO Tasikmalaya</option>
                <option value="SO Cirebon">SO Cirebon</option>
                <option value="SO Karawang">SO Karawang</option>
                <option value="SO Depok">SO Depok</option>
                <option value="SO Depok 2">SO Depok 2</option>
                <option value="SO Bekasi Kota">SO Bekasi Kota</option>
                <option value="SO Bekasi Kabupaten">SO Bekasi Kabupaten</option>
                <option value="SO Tangerang Selatan">SO Tangerang Selatan</option>
                <option value="SO Tangerang Kota">SO Tangerang Kota</option>
            </select>
        </div>

        <!-- Daftar Aset Cabang -->
        <div id="assetList" class="space-y-3">
            <div class="text-center py-8 text-slate-400 text-sm">Silakan pilih kantor cabang terlebih dahulu.</div>
        </div>
    </div>

    <!-- Modal Form Laporan OB -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800" id="modalAssetName">Laporan Aset</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="obReportForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="selectedAssetId">
                <input type="hidden" id="selectedAssetCode">
                <input type="hidden" id="selectedAssetLocation">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kondisi Saat Ini</label>
                    <select id="conditionSelect" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Baik">Baik</option>
                        <option value="Perlu perbaikan">Perlu Perbaikan</option>
                        <option value="Mati">Mati</option>
                        <option value="Perlu di sedot">Perlu di Sedot</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan OB / Kendala</label>
                    <textarea id="noteInput" rows="3" placeholder="Jelaskan detail kendala..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 rounded-lg font-medium text-sm">Batal</button>
                    <button type="submit" id="submitBtn" class="w-1/2 py-2.5 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700 flex justify-center items-center gap-2">
                        <span>Kirim Laporan</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Application & Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Config Firebase (Tetap sesuai konfigurasi Anda)
        const firebaseConfig = {
            databaseURL: "https://management-asset-ga-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Inisialisasi EmailJS dengan Public Key Anda
        emailjs.init("RBBWijqZ4nBcp5Qo8");

        // Mapping Email PIC Kantor Cabang GA
        const officeEmailMapping = {
            "Karang tinggal": "filemon.megavision@hotmail.com",
            "Aruman": "filemon.megavision@hotmail.com",
            "BN 1": "Ajisetyo347@gmail.com",
            "BN 2": "Ajisetyo347@gmail.com",
            "BN 3": "Ajisetyo347@gmail.com",
            "Cipadung": "egigunaww16@gmail.com",
            "Baleendah": "egigunaww16@gmail.com",
            "Bango": "Amos.megavision@hotmail.com, Jeremi.megavision@hotmail.com",
            "Cifor": "Amos.megavision@hotmail.com, Jeremi.megavision@hotmail.com",
            "Kedung Halang": "Amos.megavision@hotmail.com, Jeremi.megavision@hotmail.com",
            "SO Tasikmalaya": "Seja.megavision@hotmail.com",
            "SO Cirebon": "nano.megavision@hotmail.com",
            "SO Karawang": "andreas.megavision@hotmail.com",
            "SO Depok": "zeffanya.megavision@hotmail.com",
            "SO Depok 2": "zeffanya.megavision@hotmail.com",
            "SO Bekasi Kota": "lamtongam.megavision@hotmail.com",
            "SO Bekasi Kabupaten": "joshua.megavision@hotmail.com",
            "SO Tangerang Selatan": "tompo.megavision@hotmail.com",
            "SO Tangerang Kota": "giovanni.megavision@hotmail.com"
        };

        let globalAssets = [];
        let globalRepairs = [];

        onValue(ref(db, 'assets'), (snapshot) => {
            const data = snapshot.val();
            globalAssets = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
            loadBranchAssets();
        });

        onValue(ref(db, 'repairs'), (snapshot) => {
            const data = snapshot.val();
            globalRepairs = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
            loadBranchAssets();
        });

        window.loadBranchAssets = () => {
            const branch = document.getElementById('branchSelect').value;
            const container = document.getElementById('assetList');
            container.innerHTML = '';

            if (!branch) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Silakan pilih kantor cabang terlebih dahulu.</div>`;
                return;
            }

            const filtered = globalAssets.filter(a => a.location === branch);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Tidak ada aset terdaftar di cabang ini.</div>`;
                return;
            }

            filtered.forEach(asset => {
                const isLocked = globalRepairs.some(r => r.assetCode === asset.code && r.status === 'Aktif');

                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-xl shadow-sm border ${isLocked ? 'border-amber-300 bg-amber-50/30' : 'border-slate-200'} flex items-center justify-between`;
                
                let statusBadge = `<span class="px-2 py-0.5 text-xs font-semibold rounded bg-emerald-100 text-emerald-700">Baik</span>`;
                if (isLocked) {
                    statusBadge = `<span class="px-2 py-0.5 text-xs font-semibold rounded bg-amber-100 text-amber-700"><i class="fa-solid fa-wrench mr-1"></i>Dalam Perbaikan</span>`;
                } else if (asset.condition !== 'Baik') {
                    statusBadge = `<span class="px-2 py-0.5 text-xs font-semibold rounded bg-rose-100 text-rose-700">${asset.condition}</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="text-xs text-slate-400 font-mono">${asset.code}</div>
                        <div class="font-bold text-slate-800 text-sm">${asset.name}</div>
                        <div class="mt-1">${statusBadge}</div>
                    </div>
                    <div>
                        ${isLocked ? `
                            <button disabled class="px-3 py-1.5 bg-slate-200 text-slate-400 rounded-lg text-xs font-semibold cursor-not-allowed">
                                <i class="fa-solid fa-lock"></i> Terkunci
                            </button>
                        ` : `
                            <button onclick="openModal('${asset.id}', '${asset.code}', '${asset.name}', '${asset.location}', '${asset.condition}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold">
                                LAPOR
                            </button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.openModal = (id, code, name, location, condition) => {
            document.getElementById('selectedAssetId').value = id;
            document.getElementById('selectedAssetCode').value = code;
            document.getElementById('selectedAssetLocation').value = location;
            document.getElementById('modalAssetName').innerText = `${name} (${code})`;
            document.getElementById('conditionSelect').value = condition || 'Baik';
            document.getElementById('noteInput').value = '';
            document.getElementById('reportModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('reportModal').classList.add('hidden');
        };

        // Fungsi Pengiriman Email Otomatis via EmailJS (Service ID: service_yqhzkys, Template ID: template_zzn76o8)
        async function sendNotificationEmail(location, subject, bodyMessage) {
            const recipientEmail = officeEmailMapping[location] || "admin.ga@megavision.com";
            
            const templateParams = {
                to_email: recipientEmail,
                subject: subject,
                message: bodyMessage,
                location: location
            };

            try {
                await emailjs.send('service_yqhzkys', 'template_zzn76o8', templateParams);
                console.log('Email kendala berhasil terkirim ke:', recipientEmail);
            } catch (err) {
                console.error('Gagal mengirim email via EmailJS:', err);
            }
        }

        window.handleFormSubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

            const assetId = document.getElementById('selectedAssetId').value;
            const assetCode = document.getElementById('selectedAssetCode').value;
            const location = document.getElementById('selectedAssetLocation').value;
            const newCondition = document.getElementById('conditionSelect').value;
            const note = document.getElementById('noteInput').value;

            try {
                // 1. Update Kondisi Aset di Firebase Database
                await update(ref(db, `assets/${assetId}`), {
                    condition: newCondition,
                    lastInspected: new Date().toISOString()
                });

                // 2. Trigger jika kondisi: 'Perlu perbaikan', 'Mati', atau 'Perlu di sedot'
                if (newCondition !== 'Baik') {
                    const existingActive = globalRepairs.some(r => r.assetCode === assetCode && r.status === 'Aktif');
                    
                    if (!existingActive) {
                        // Simpan Tiket Perbaikan ke Firebase
                        await push(ref(db, 'repairs'), {
                            assetCode: assetCode,
                            location: location,
                            condition: newCondition,
                            note: note,
                            status: 'Aktif',
                            createdAt: new Date().toISOString()
                        });

                        // Susun & Kirim Email ke PIC Cabang
                        const emailSubject = `[URGENT LAPORAN OB] Kendala Aset ${newCondition.toUpperCase()} - ${location}`;
                        const emailBody = `Halo Tim GA & PIC Cabang,\n\nPetugas OB melaporkan kendala pada aset berikut:\n\n` +
                                          `- Kode Aset: ${assetCode}\n` +
                                          `- Lokasi Cabang: ${location}\n` +
                                          `- Status/Kondisi: ${newCondition.toUpperCase()}\n` +
                                          `- Catatan Lapangan: ${note || '-'}\n` +
                                          `- Tanggal & Waktu: ${new Date().toLocaleString('id-ID')}\n\n` +
                                          `Aset ini telah dikunci di sistem hingga dilakukan tindakan penanganan/perbaikan.\n\n` +
                                          `Terima kasih,\nSistem Inspeksi GA Mobile`;

                        await sendNotificationEmail(location, emailSubject, emailBody);
                    }
                }

                alert('Laporan berhasil dikirim!');
                closeModal();
            } catch (error) {
                alert('Gagal mengirim laporan: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Kirim Laporan</span>`;
            }
        };
    </script>
</body>
</html>
